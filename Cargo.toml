[package]
name = "wallrotate"
version = "1.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/elazarza/wallrotate"
description = "Low-footprint multi-monitor wallpaper rotator with animated GIF and video backgrounds for Windows"

[dependencies]
image = { version = "0.25", default-features = false, features = ["gif"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
toml = "0.8"
webview2-com = "0.32.0"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_Dxgi_Common",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_Power",
  "Win32_System_RemoteDesktop",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemServices",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Performance",
  "Win32_Security",
  "Win32_Media",
  "Win32_System_SystemInformation",
  "Win32_System_WinRT",
  "Win32_System_Environment",
  "Win32_Storage_FileSystem",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_UI_Controls_Dialogs",
  "Win32_Media_MediaFoundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "implement",
] }
windows-core = "0.58"

[build-dependencies]
embed-resource = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
